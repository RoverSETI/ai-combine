# ============================================================
#  models.ini — пресеты моделей для llama-server (router mode)
#
#  Имена ключей = полные имена опций llama-server (без "--"):
#    ctx-size, n-gpu-layers, flash-attn, cache-type-k, mmproj...
#  Секция [*] — общие значения для всех моделей.
#  Секция модели переопределяет общие значения.
#
#  ШАБЛОН ЧАТА НЕ ЗАДАЁМ: каждый GGUF использует свой встроенный
#  шаблон (llama-server 0.7+ берёт его из модели сам, jinja включён).
#  Глобальный --chat-template ломал Llama-3.1 и Nemotron.
#
#  ВАЖНО ПРО ZCODE (исправление context_exceeded):
#  ZCode шлёт в каждый запрос ~14.5k токенов уже "на старте"
#  (системный промпт + спецификации инструментов). Любая модель
#  с ctx-size < ~16k в ZCode работать НЕ БУДЕТ — ошибка
#  "request (14536 tokens) exceeds the available context size".
#  Поэтому для моделей, которые нужны в ZCode, ctx-size поднят
#  до 16384-32768. Секция [*] оставлена 8192 как предохранитель
#  для моделей, которым контекст не поднимали.
# ============================================================

[*]
host = 127.0.0.1
n-gpu-layers = 99          # все слои — в VRAM RTX 3060
ctx-size = 8192            # предохранитель: без этого берётся ctx из модели (32k+) и VRAM не хватит
parallel = 1               # 1 слот = полный ctx для запроса; авто-слоты (4x) делили KV-пул,
                           # и 2+ параллельных запроса давали "Context size has been exceeded"
flash-attn = on            # ускорение + экономия VRAM
cache-type-k = q8_0        # KV-кэш в 8 бит вместо 16 (требует flash-attn)
cache-type-v = q8_0        # включено 06.11: 32 спеки MCP-инструментов (~19k токенов)
                           # не влезали в 32k — V-квант высвобождает VRAM для ctx 40960

# --- Универсальная основная ---
[qwen3.5-9b-instruct]
model = /home/rover/AI-Combine/AI-Models/Qwen3.5-9B-Q8_0.gguf
# 49152 (07.11): фактический промпт чата с 32 MCP-спеками + RAG + системный =
# 41216-42077 токенов > 40960 — дефицит 0.3-1.2k. V-квант компенсирует VRAM
# (~11.2 из 12.3 ГБ). Если карта не тянет — вернуть 40960 и резать промпт.
ctx-size = 49152

# --- Кодинг ---
# [qwen2.5-coder-7b] УДАЛЕНА 14.11 (решение пользователя, чекбокс): tools фантазируют,
#   полностью перекрыта qwen3.5-9b (Q8, tools ✓). Файл → BACK Sys_Backup/archive-20261114/models-gguf/
#   Вернуть: строка model = /home/rover/AI-Combine/AI-Models/qwen2.5-coder-7b-instruct-q4_k_m.gguf, ctx-size = 32768
# [qwen2.5-coder-3b] УДАЛЕНА 14.11: никуда не подключена, дубль qwen3-4b. Файл там же.
#   Вернуть: model = /home/rover/AI-Combine/AI-Models/qwen2.5-coder-3b-instruct-q4_k_m.gguf, ctx-size = 16384
# [qwen2.5-coder-0.5b] УДАЛЕНА 14.11 (чекбокс): была только моделью прогрева — прогрев
#   переведён на qwen3-4b-instruct-2507 (см. start_ai.sh WARMUP_MODEL). Файл там же.
#   Вернуть: model = /home/rover/AI-Combine/AI-Models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf, ctx-size = 2048
# [llama-3.1-8b-instruct] УДАЛЕНА 14.11 (чекбокс): tool-calling сломан в WebUI (peg-native),
#   полностью перекрыта qwen3.5-9b. Файл: Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf там же.
#   Вернуть: model = /home/rover/AI-Combine/AI-Models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf, ctx-size = 32768

# --- Зрение (VL) ---
[nvidia-nemotron-12b-vision]
model = /home/rover/AI-Combine/AI-Models/NVIDIA-Nemotron-Nano-12B-v2-VL-Q4_K_M.gguf
mmproj = /home/rover/AI-Combine/AI-Models/NVIDIA-Nemotron-Nano-12B-v2-VL-BF16-mmproj.gguf
# было 8192 (наследовалось) — отсюда ошибка "14536 > 8192".
# У этой модели гибридная Mamba2-архитектура: рекуррентное состояние фиксированное,
# attention-слоёв мало, поэтому большой контекст стоит недорого. 32k — минимум для ZCode
# (картинки в VL-моделях дополнительно съедают сотни-тысячи токенов каждая).
# Если VRAM позволит (смотрите nvidia-smi), можно поднять до 65536.
ctx-size = 32768
# если начнёт глючить — верните ей полный KV-кэш:
# cache-type-k = f16

# --- Мини-агент (быстрый tool-calling) ---
[qwen3-4b-instruct-2507]
model = /home/rover/AI-Combine/AI-Models/text/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
ctx-size = 12288

# ============================================================
# ⚠️ ТЯЖЁЛЫЙ РЕЖИМ: MoE 35B — ОТДЕЛЬНЫЙ ПУНКТ С ЖЁСТКИМИ
# ОГРАНИЧЕНИЯМИ ПОДГРУЗОК (14.11, по явной просьбе пользователя).
# Правила этой секции:
#   1. Эксперты MoE — ТОЛЬКО на CPU/RAM (n-cpu-moe), на GPU —
#      активное ядро + KV. Не поднимать n-gpu-layers выше 99!
#   2. Контекст ЖЁСТКО 16384 — не поднимать: KV-кэш съест VRAM
#      и задушит ComfyUI.
#   3. mmproj (зрение) НЕ подключать без явного расчёта VRAM.
#   4. parallel = 1 — никаких параллельных слотов.
#   5. Первый прогрев медленный (20 ГБ mmap с NVMe) — это НОРМА,
#      не перезапускать из-за этого.
# Запуск только когда ComfyUI/графика не работают (политика
# «последний запущенный получает память»).
# ============================================================
[qwen3.6-35b-a3b]
model = /home/rover/AI-Combine/AI-Models/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf
n-cpu-moe = 28          # 28 слоёв экспертов на CPU (24 не хватило: cudaMalloc 392MiB OOM при старте 14.11)
ctx-size = 49152        # УВЕЛИЧЕНО с 32768 (26.11): сессия ZCode разрослась до 32989 токенов → 400 context_exceeded.
                        # KV-кэш q8_0 при 48k: ~3.2 ГБ VRAM. С n-cpu-moe=28 эксперты на CPU,
                        # на GPU — активное ядро + KV: ~10.7 ГБ из 12 ГБ. Запас мал, но влезает.
parallel = 1
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
chat-template-kwargs = {"enable_thinking": false}
# thinking ВЫКЛ: Qwen3.6 рассуждает только по-английски (не контролируется промптом),
# пользователь требует всё на русском. Вернуть размышления — удалить строку выше.
# mmproj НЕ подключён — зрение этой модели пока отключено (правило 3)
# ВНИМАНИЕ: если VRAM не хватит (OOM при загрузке) — вернуть 16384 и использовать qwen3.5-9b в ZCode.
