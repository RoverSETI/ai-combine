# ============================================================
#  models.ini — пресеты моделей для llama-server (router mode)
#
#  Имена ключей = полные имена опций llama-server (без "--"):
#    ctx-size, n-gpu-layers, flash-attn, cache-type-k, mmproj...
#  Секция [*] — общие значения для всех моделей.
#  Секция модели переопределяет общие значения.
#
#  ШАБЛОН ЧАТА НЕ ЗАДАЁМ: каждый GGUF использует свой встроенный
#  шаблон (llama-server 0.7+ берёт его из модели сам, jinja включён).
#  Глобальный --chat-template ломал Llama-3.1 и Nemotron.
#
#  ВАЖНО ПРО ZCODE (исправление context_exceeded):
#  ZCode шлёт в каждый запрос ~14.5k токенов уже "на старте"
#  (системный промпт + спецификации инструментов). Любая модель
#  с ctx-size < ~16k в ZCode работать НЕ БУДЕТ — ошибка
#  "request (14536 tokens) exceeds the available context size".
#  Поэтому для моделей, которые нужны в ZCode, ctx-size поднят
#  до 16384-32768. Секция [*] оставлена 8192 как предохранитель
#  для моделей, которым контекст не поднимали.
# ============================================================

[*]
host = 127.0.0.1
n-gpu-layers = 99          # все слои — в VRAM RTX 3060
ctx-size = 8192            # предохранитель: без этого берётся ctx из модели (32k+) и VRAM не хватит
parallel = 1               # 1 слот = полный ctx для запроса; авто-слоты (4x) делили KV-пул,
                           # и 2+ параллельных запроса давали "Context size has been exceeded"
flash-attn = on            # ускорение + экономия VRAM
cache-type-k = q8_0        # KV-кэш в 8 бит вместо 16 (требует flash-attn)
cache-type-v = q8_0        # включено 06.11: 32 спеки MCP-инструментов (~19k токенов)
                           # не влезали в 32k — V-квант высвобождает VRAM для ctx 40960

# --- Универсальная основная ---
[qwen3.5-9b-instruct]
model = /home/rover/AI-Models/Qwen3.5-9B-Q8_0.gguf
# 40960 (06.11): 32 MCP-инструмента + RAG давали промпт 33k токенов > 32768 —
# цикл tool-calling умирал с "exceeds the available context size".
# V-квант компенсирует VRAM. Если карта не тянет — вернуть 32768.
ctx-size = 40960

# --- Кодинг ---
[qwen2.5-coder-7b]
model = /home/rover/AI-Models/qwen2.5-coder-7b-instruct-q4_k_m.gguf
# было 8192 (наследовалось) — в ZCode не работала; 32k KV-кэша q8_0 ≈ 0.9 ГБ
ctx-size = 32768

[qwen2.5-coder-3b]
model = /home/rover/AI-Models/qwen2.5-coder-3b-instruct-q4_k_m.gguf
# было 4096 — в ZCode не работала; 16k KV-кэша ≈ 0.3 ГБ
ctx-size = 16384

# --- Быстрая малышка для мелких задач и прогрева ---
# ctx 2048 оставлен намеренно: в ZCode её не использовать
[qwen2.5-coder-0.5b]
model = /home/rover/AI-Models/qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
ctx-size = 2048

# --- Llama ---
[llama-3.1-8b-instruct]
model = /home/rover/AI-Models/Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
# было 8192 (наследовалось) — в ZCode не работала; 32k KV-кэша q8_0 ≈ 2.0 ГБ.
# 64k тоже влезет (~4 ГБ KV), но впритык к 12 ГБ карты — только если нужно.
ctx-size = 32768

# --- Зрение (VL) ---
[nvidia-nemotron-12b-vision]
model = /home/rover/AI-Models/NVIDIA-Nemotron-Nano-12B-v2-VL-Q4_K_M.gguf
mmproj = /home/rover/AI-Models/NVIDIA-Nemotron-Nano-12B-v2-VL-BF16-mmproj.gguf
# было 8192 (наследовалось) — отсюда ошибка "14536 > 8192".
# У этой модели гибридная Mamba2-архитектура: рекуррентное состояние фиксированное,
# attention-слоёв мало, поэтому большой контекст стоит недорого. 32k — минимум для ZCode
# (картинки в VL-моделях дополнительно съедают сотни-тысячи токенов каждая).
# Если VRAM позволит (смотрите nvidia-smi), можно поднять до 65536.
ctx-size = 32768
# если начнёт глючить — верните ей полный KV-кэш:
# cache-type-k = f16

# --- Мини-агент (быстрый tool-calling) ---
[qwen3-4b-instruct-2507]
model = /home/rover/AI-Models/text/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
ctx-size = 12288
